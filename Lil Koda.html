<style>

body{
    background:#000080; /* classic blue */
    color:#00ff00; /* neon green */
    font-family:"Courier New", Courier, monospace;
    margin:0;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px 10px;
}

/* BACK BUTTON */

.back{
    margin-bottom:20px;
}

.back button{
    padding:6px 14px;
    background:#c0c0c0;
    border:2px outset #fff;
    color:#000;
    font-family:inherit;
    cursor:pointer;
}

.back button:hover{
    background:#a0a0a0;
}

/* ARTIST */

.artist-img{
    width:200px;
    margin-bottom:15px;
    border:2px solid #00ff00;
}

.artist-name{
    font-size:32px;
    margin-bottom:15px;
    color:#ffff00;
    text-transform:uppercase;
}

/* BIO */

.bio{
    max-width:600px;
    margin:auto;
    color:#cccccc;
    font-size:13px;
}

/* SECTION */

.section{
    margin-top:40px;
}

/* LINKS */

.links a{
    display:inline-block;
    margin:8px;
}

.links button{
    padding:6px 14px;
    background:#c0c0c0;
    border:2px outset #fff;
    color:#000;
    font-family:inherit;
    cursor:pointer;
}

.links button:hover{
    background:#a0a0a0;
}

/* RELEASE LIST */

.release{
    margin-top:10px;
}

.release a{
    color:#00ff00;
    text-decoration:none;
}

.release a:hover{
    text-decoration:underline;
}

/* FOOTER */

footer{
    margin-top:60px;
    padding:20px;
    border-top:3px double #00ff00;
    color:#00ff00;
    font-size:12px;
}

/* RELEASE CARD */

.release-card{
    display:block;
    background:#000;
    border:2px solid #00ff00;
    padding:10px;
    margin:10px auto;
    text-decoration:none;
    color:#00ff00;
    max-width:500px;
}

.release-card:hover{
    background:#001a00;
}

/* COVER */

.cover-box{
    width:100px;
    height:100px;
    overflow:hidden;
    border:2px solid #00ff00;
    margin-bottom:8px;
}

.cover-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TEXT */

.release-info{
    text-align:center;
}

.title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:4px;
}

.meta{
    font-size:11px;
    color:#cccccc;
    line-height:1.3;
}
